name: Build DeskFlow Android Test APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - deskflow-android
    paths:
      - "deskflow/**"
      - ".github/workflows/build-deskflow-android-hosted.yml"
  pull_request:
    branches:
      - master
    paths:
      - "deskflow/**"
      - ".github/workflows/build-deskflow-android-hosted.yml"

permissions:
  contents: read

concurrency:
  group: deskflow-android-hosted
  cancel-in-progress: true

jobs:
  build:
    name: DeskFlow ARM64 Test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      FREERDP_VERSION: "3.30.0"
      VERSION_NAME: "0.1.0-test"
      VERSION_CODE: "100"

    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build DeskFlow from official FreeRDP source
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x deskflow/build_deskflow_android_debug.sh
          deskflow/build_deskflow_android_debug.sh

      - name: Upload DeskFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-v0.1.0-test-arm64-v8a
          retention-days: 30
          if-no-files-found: error
          path: |
            deskflow-output/DeskFlow-v0.1.0-test-arm64-v8a-debug.apk
            deskflow-output/DeskFlow-v0.1.0-test-arm64-v8a-debug.apk.sha256
